<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STOCK</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <img src="img/banner.jpg" alt="Banner da loja de roupas">
    </header>

    <main>

        <h1>Loja de Roupas</h1>

        <section class="produtos">

            <article class="card">
                <h2>Camiseta Rock</h2>
                <p>Camiseta preta com estampa de rock.</p>
                <p class="preco">€ 25,00</p>
                <button>Adicionar ao carrinho</button>
            </article>

            <article class="card">
                <h2>Jaqueta Jeans</h2>
                <p>Jaqueta jeans clássica e confortável.</p>
                <p class="preco">€ 59,90</p>
                <button>Adicionar ao carrinho</button>
            </article>

            <article class="card">
                <h2>Calça Jeans</h2>
                <p>Calça jeans de corte tradicional.</p>
                <p class="preco">€ 49,90</p>
                <button>Adicionar ao carrinho</button>
            </article>

        </section>

        <button id="btnCarrinho">
            Carrinho: <span id="quantidadeCarrinho">0</span>
        </button>

        <div id="carrinho"></div>

    </main>

    <script src="js/javascript.js"></script>

</body>

</html>
